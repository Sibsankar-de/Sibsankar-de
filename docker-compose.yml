version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: portfolio-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    restart: always

volumes:
  mongodb_data:
